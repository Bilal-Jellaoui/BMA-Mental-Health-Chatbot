<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMA — Tableau de bord analytique</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --teal: #1a7a6e;
  --teal-lt: #2aab9a;
  --teal-pale: #e8f5f3;
  --gold: #c9a84c;
  --cream: #fafaf8;
  --ink: #1a1f1e;
  --ink-soft: #3d4642;
  --muted: #8a9490;
  --white: #ffffff;
  --border: #e2e8e6;
  --shadow-sm: 0 4px 12px rgba(26,122,110,.08);
  --r: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  padding: 24px 32px;
}
.dashboard-container {
  max-width: 1400px;
  margin: 0 auto;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
  flex-wrap: wrap;
  gap: 16px;
}
.header h1 {
  font-size: 28px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--teal), var(--teal-lt));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}
.header a {
  color: var(--teal);
  text-decoration: none;
  font-weight: 500;
  border: 1.5px solid var(--border);
  padding: 8px 20px;
  border-radius: 40px;
  transition: 0.2s;
}
.header a:hover { background: var(--teal-pale); border-color: var(--teal); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--white);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.stat-card h3 {
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 12px;
}
.stat-number {
  font-size: 36px;
  font-weight: 800;
  color: var(--teal);
  line-height: 1;
}
.stat-sub {
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 8px;
}
.charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 32px;
}
.chart-card {
  background: var(--white);
  border-radius: var(--r);
  padding: 18px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.chart-card h3 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--ink);
  border-left: 4px solid var(--gold);
  padding-left: 12px;
}
canvas { max-height: 280px; width: 100%; }
.recent-list {
  background: var(--white);
  border-radius: var(--r);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.recent-list h3 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
  border-left: 4px solid var(--gold);
  padding-left: 12px;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 10px 6px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
}
th { color: var(--teal); font-weight: 600; }
.loader {
  text-align: center;
  padding: 40px;
  color: var(--muted);
}
.error-message {
  background: #fee2e2;
  color: #b91c1c;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 20px;
  font-size: 13px;
}
@media (max-width: 800px) {
  .charts-row { grid-template-columns: 1fr; }
  body { padding: 16px; }
}
</style>
</head>
<body>
<div class="dashboard-container">
  <div class="header">
    <h1>📊 Tableau de bord · BMA</h1>
    <a href="/">← Retour au chat</a>
  </div>

  <div id="dashboardContent">
    <div class="loader">Chargement des statistiques...</div>
  </div>
</div>

<script>
const API_BASE = "";
let emotionChart = null;
let sourceChart = null;

async function loadDashboard() {
  const container = document.getElementById('dashboardContent');
  try {
    // Appels aux APIs backend (à adapter selon tes routes)
    const [statsRes, timelineRes, recentRes] = await Promise.all([
      fetch(`${API_BASE}/api/stats`).catch(() => null),
      fetch(`${API_BASE}/api/emotions/history`).catch(() => null),
      fetch(`${API_BASE}/api/conversations/recent`).catch(() => null)
    ]);

    let stats = { total_conversations: 0, avg_emotion_score: 0, dataset_ratio: 0, llm_ratio: 0 };
    let timeline = { dates: [], emotions: [] };
    let recent = [];

    if (statsRes && statsRes.ok) stats = await statsRes.json();
    else console.warn("Statistiques non disponibles, utilisation de valeurs mockées");

    if (timelineRes && timelineRes.ok) timeline = await timelineRes.json();
    else {
      // Mock data pour démo
      timeline = {
        dates: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'],
        emotions: [6.2, 5.8, 7.1, 5.5, 6.9, 7.4]
      };
    }

    if (recentRes && recentRes.ok) recent = await recentRes.json();
    else {
      recent = [
        { time: "2025-04-28 09:32", message: "Je me sens stressé", emotion: "stress" },
        { time: "2025-04-28 10:15", message: "Merci pour ton aide", emotion: "gratitude" },
        { time: "2025-04-27 22:05", message: "J'ai du mal à dormir", emotion: "insomnie" }
      ];
    }

    renderDashboard(stats, timeline, recent);
  } catch (err) {
    console.error(err);
    container.innerHTML = `<div class="error-message">❌ Impossible de charger les données. Vérifie que le serveur backend est lancé (python run.py).</div>`;
  }
}

function renderDashboard(stats, timeline, recent) {
  const container = document.getElementById('dashboardContent');

  // Dataset vs LLM ratio
  const datasetPct = stats.dataset_ratio ?? 68;
  const llmPct = stats.llm_ratio ?? 32;

  const html = `
    <div class="stats-grid">
      <div class="stat-card"><h3>💬 Conversations</h3><div class="stat-number">${stats.total_conversations ?? 142}</div><div class="stat-sub">depuis le lancement</div></div>
      <div class="stat-card"><h3>😌 Émotion moyenne</h3><div class="stat-number">${(stats.avg_emotion_score ?? 6.4).toFixed(1)}</div><div class="stat-sub">sur 10 (1 = très négatif)</div></div>
      <div class="stat-card"><h3>📚 Réponses Dataset</h3><div class="stat-number">${datasetPct}%</div><div class="stat-sub">intents prédits avec confiance ≥ seuil</div></div>
      <div class="stat-card"><h3>🧠 Réponses LLM</h3><div class="stat-number">${llmPct}%</div><div class="stat-sub">Gemini / Groq (fallback)</div></div>
    </div>

    <div class="charts-row">
      <div class="chart-card"><h3>📈 Évolution de l’humeur</h3><canvas id="emotionTimelineChart" width="400" height="250"></canvas></div>
      <div class="chart-card"><h3>🔄 Source des réponses</h3><canvas id="responseSourceChart" width="400" height="250"></canvas></div>
    </div>

    <div class="recent-list">
      <h3>📝 Derniers échanges</h3>
      <table>
        <thead><tr><th>Date</th><th>Message</th><th>Émotion détectée</th></tr></thead>
        <tbody>
          ${recent.map(row => `<tr><td>${row.time}</td><td>${escapeHtml(row.message.substring(0, 60))}</td><td>${row.emotion ?? '—'}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;

  container.innerHTML = html;

  // Graphique humeur
  const ctx = document.getElementById('emotionTimelineChart').getContext('2d');
  if (emotionChart) emotionChart.destroy();
  emotionChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: timeline.dates,
      datasets: [{
        label: 'Humeur (moyenne /10)',
        data: timeline.emotions,
        borderColor: '#1a7a6e',
        backgroundColor: 'rgba(26,122,110,0.05)',
        tension: 0.2,
        fill: true,
        pointBackgroundColor: '#c9a84c',
        pointBorderColor: '#fff',
        pointRadius: 4
      }]
    },
    options: { responsive: true, maintainAspectRatio: true, scales: { y: { min: 0, max: 10, title: { display: true, text: 'Bien-être' } } } }
  });

  // Graphique camembert dataset vs LLM
  const sourceCtx = document.getElementById('responseSourceChart').getContext('2d');
  if (sourceChart) sourceChart.destroy();
  sourceChart = new Chart(sourceCtx, {
    type: 'doughnut',
    data: {
      labels: ['Dataset (intents)', 'LLM (Gemini/Groq)'],
      datasets: [{ data: [datasetPct, llmPct], backgroundColor: ['#2aab9a', '#c9a84c'], borderWidth: 0 }]
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
  });
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

loadDashboard();
</script>
</body>
</html>
